<!DOCTYPE html>
<html>
<head>
  <title>AstroNav Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #08111f;
      color: white;
      margin: auto ;
      animation: fadeIn 0.8s ease-in-out;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 50px;
      animation: slideDown 0.6s ease-out;
    }

    h1 {
      color: #38bdf8;
    }

    .card {
      background: #122033;
      border: 1px solid #33475c;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    button {
      
      background: #122033;
      color: white;
      border: 1px solid #38bdf8;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
    }

    button:hover {
      background: #38bdf8;
      padding: 5px;
      color: black;
      border:1px solid #38bdf8;
    }

    .small {
      color: #aaa;
    }

    footer{
      text-align: center;
      padding: 30px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>ASTRONAV DASHBOARD</h1>
      <p>Simple NASA space information dashboard</p>
    </header>

    <h2>NASA Picture of the Day</h2>

    <div class="card" id="picture">
      Loading picture...
    </div>


    <h2>Asteroids Near Earth</h2>

    <div class="grid" id="asteroids">
      Loading asteroids...
    </div>


    <h2>NASA News</h2>

    <button onclick="getNews('space')">Space</button>
    <button onclick="getNews('mars')">Mars</button>
    <button onclick="getNews('artemis')">Artemis</button>

    <div class="grid" id="news">
      Loading news...
    </div>

  </div>

  <footer>
    Made by Jignesh Phalsawal [using NASA APIs]
  </footer>


  <script>

    //  api key by official nasa api key generator
    var apiKey = "uKDQ5WDDtwZdqbmbr0t6HggLZY5WblDkZDhsocxQ";


   // pic of the day

    fetch("https://api.nasa.gov/planetary/apod?api_key=" + apiKey + "&thumbs=true")
      
    .then(function(response) {
        return response.json();
      })


      .then(function(data) {
        var mediaHtml = "";

                // Determine if we have a valid image or thumbnail to display(to reject videos),because api cant run videos well
    if (data.media_type === "image") {
      mediaHtml = "<img src='" + data.url + "'>";
    }else  {
      mediaHtml = "<p class='small'><i>[No image available for this article sorry<3]</i></p>";
    }

        document.getElementById("picture").innerHTML =
         
        "<h3>" + data.title + "</h3>" +

          "<p class='small'>" + data.date + "</p>" + mediaHtml +

          

          "<p>" + data.explanation + "</p>";

      });
      


    // asteroids near earth

    var today = new Date().toISOString().split("T")[0];

    var asteroidlocation =
      "https://api.nasa.gov/neo/rest/v1/feed" +
      "?start_date=" + today +
      "&end_date=" + today +
      "&api_key=" + apiKey;

   
   
      fetch(asteroidlocation)
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {

        var asteroids = data.near_earth_objects[today];

        var box = document.getElementById("asteroids");

        box.innerHTML = "";

       // to limit the number of asteroids displayed to 6
       for (var i = 0; i < 6 && i < asteroids.length; i++) {

          var asteroid = asteroids[i];

          var name = asteroid.name;

          var diameter = Math.round(
            asteroid.estimated_diameter.meters.estimated_diameter_min
          );

          var speed = Math.round(
            asteroid.close_approach_data[0]
              .relative_velocity.kilometers_per_hour
          );

          var distance = Math.round(
            asteroid.close_approach_data[0]
              .miss_distance.kilometers
          );

          box.innerHTML +=
            "<div class='card'>" +
            "<h3>" + name + "</h3>" +
            "<p>Diameter: " + diameter + " meters</p>" +
            "<p>Speed: " + speed + " km/h</p>" +
            "<p>Distance: " + distance + " km</p>" +
            
            
            "</div>";
        }

      })
      .catch(function() {

        document.getElementById("asteroids").innerHTML =
          "Asteroid information could not be loaded.";

      });


    // nasa news

    function getNews(topic) {

      var news =
        "https://images-api.nasa.gov/search?q=" +
        topic +
        "&media_type=image";

      fetch(news)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {

          var news = data.collection.items;
          var box = document.getElementById("news");

          

          box.innerHTML = "";
     // to limit the number of news items displayed to 6
          for (var i = 0; i < 6 && i < news.length; i++) {

            var item = news[i];
            var info = item.data[0];

            var image = "";
          //to Check if the item has links and use the first link as the image source
            if (item.links) {
              image = item.links[0].href;
            }

            box.innerHTML +=
              "<div class='card'>" +  
              "<h3>" + info.title + "</h3>" +
              "<p>" + (info.description || "No description ") +
              "</p>" + "<img src='" + image + "'>" +
              "</div>";
          }

        })
        

        };


    // load  news when the page opens up
    getNews("space");

  
  </script>


</body>
</html>
